<head>
    <style link = stylesheet></style>
    
</head>

<body>
    <h1> Song Search </h1>

    <div class = "mainflex">
        <span class="dropdown1">
            <button onclick="myFunction1()" class="dropbtn">Search by</button>
            <span id="myDropdown1" class="dropdown-content">
                <a href="#" data-value="title">Title</a>
                <a href="#" data-value="artists">Artist</a>
                <a href="#" data-value="genres">Genre</a>
            </span>
        </span>

        <span class="dropdown2">
            <button onclick="myFunction2()" class="dropbtn">Sort by</button>
            <span id="myDropdown2" class="dropdown-content">
                <a href="#" data-value="popularity">Popularity</a>
                <a href="#" data-value="duration_mins">Duration</a>
            </span>
        </span>

        <span>
            <input type="checkbox" id="explicit" name="explicit" />
            <label for= "explicit">Include explicit songs?</label>
        </span>
        
    
        <input type="text" placeholder="Search.." id="myInput"> 
        <button type="button" onclick="getData()">Search</button> 
    
        
    </div>
    <ul id="results"></ul>
    
    <script>
        let searchBy = "title";
        let sortBy = "popularity";

        async function getData(){
            
            const searchTerms = document.getElementById("myInput").value.trim();
            if (!searchTerms) return;


            try {
                const response = await fetch("/search", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "search-by": searchBy,
                        "sort-by": sortBy,
                        "explicit": document.getElementById("explicit").checked,
                        "search-bar": searchTerms
                    })
                });
                if (!response.ok) throw new Error(`Response status: ${response.status}`);

                const songs = await response.json(); // REFINE 13: .json(), not .text()
                renderResults(songs);
            } catch (error) {
                console.error("Failed to fetch songs:", error); // REFINE 14: message still said "ingredient"
            }
        }

        function renderResults(songs) {
            const list = document.getElementById("results");
            list.replaceChildren();

            for (const song of songs) {
                const item = document.createElement("li");

                // The fields that we have are: title, artists, popularity, explictit
                // url, duration_mins, genres, year.
                item.textContent = `${song.title} - ${song.artists ? song.artists.join(", ") : ""} (${song.year})`;
                list.appendChild(item);
            }   
        }

        function myFunction1() {
            document.getElementById("myDropdown1").classList.toggle("show");
        }
        function myFunction2() {
            document.getElementById("myDropdown2").classList.toggle("show");
        }

        document.querySelectorAll("#myDropdown1 a").forEach(link => {
            link.addEventListener("click", event => {
                event.preventDefault();
                searchBy = link.dataset.value;
                document.getElementById("myDropdown1").classList.remove("show");
            });
        });

        document.querySelectorAll("#myDropdown2 a").forEach(link => {
            link.addEventListener("click", event => {
                event.preventDefault();
                sortBy = link.dataset.value;
                document.getElementById("myDropdown2").classList.remove("show");
            });
        });
    </script>
</body>
