<head>
    <style>/* Dropdown Button */
        .dropbtn {
        background-color: #04AA6D;
        color: white;
        padding: 16px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        }

        /* Dropdown button on hover & focus */
        .dropbtn:hover, .dropbtn:focus {
        background-color: #3e8e41;
        }

        .mainflex {
            display: flex;
            flex-direction: row;
        }

        /* The search field */
        #myInput {
        box-sizing: border-box;
        background-image: url('searchicon.png');
        background-position: 14px 12px;
        background-repeat: no-repeat;
        font-size: 16px;
        padding: 14px 20px 12px 45px;
        border: none;
        border-bottom: 1px solid #ddd;
        }

        /* The search field when it gets focus/clicked on */
        #myInput:focus {outline: 3px solid #ddd;}

        /* The container <div> - needed to position the dropdown content */
        .dropdown1 {
        position: relative;
        display: inline-block;
        }

        .dropdown2 {
        position: relative;
        display: inline-block;
        }

        /* Dropdown Content (Hidden by Default) */
        .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f6f6f6;
        min-width: 230px;
        border: 1px solid #ddd;
        z-index: 1;
        }

        /* Links inside the dropdown */
        .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        }

        /* Change color of dropdown links on hover */
        .dropdown-content a:hover {background-color: #f1f1f1}

        /* Show the dropdown menu (use JS to add this class to the .dropdown-content container when the user clicks on the dropdown button) */
        .show {display:block;}
    </style>
    
</head>

<body>
    <h1> Song Search </h1>

    <div class = "mainflex">
        <span class="dropdown1">
            <button onclick="myFunction1()" class="dropbtn">Search by</button>
            <span id="myDropdown1" class="dropdown-content">
                <a href="#Title">Title</a>
                <a href="#Artist">Artist</a>
                <a href="#Genre">Genre</a>
            </span>

        <span class="dropdown2">
            <button onclick="myFunction2()" class="dropbtn">Sort by</button>
            <span id="myDropdown2" class="dropdown-content">
                <a href="#Title">Popularity</a>
                <a href="#Artist">Duration</a>
            </span>
        </span>

        <span>
            <input type="checkbox" id="explicit" name="explicit" value="explicit" />
            <label>Include explicit songs?</label>
        </span>
        
        <span>
            <input type="text" placeholder="Search.." id="myInput" onkeyup="filterFunction()">
        </span>
        
    </div>
    
    <script>
        /* When the user clicks on the button,
        toggle between hiding and showing the dropdown content */
        function myFunction1() {
            document.getElementById("myDropdown1").classList.toggle("show");
        }

        function myFunction2() {
            document.getElementById("myDropdown2").classList.toggle("show");
        }

        function filterFunction() {
            var input, filter, ul, li, a, i;
            input = document.getElementById("myInput");
            filter = input.value.toUpperCase();
            div = document.getElementById("myDropdown");
            a = div.getElementsByTagName("a");
            for (i = 0; i < a.length; i++) {
                txtValue = a[i].textContent || a[i].innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    a[i].style.display = "";
                } else {
                    a[i].style.display = "none";
                }
            }
        }
    </script>
</body>
